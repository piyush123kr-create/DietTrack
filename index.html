<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protein &amp; Carb Tracker</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#1a1a1a;--mu:#6e6e73;--bd:#ececec;--soft:#f6f7f9;--pr:#16a37f;--ca:#f08c1a;--ka:#5b6cf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:15px;margin:0 0 10px}h2.sec{margin:16px 2px 8px}
small,.mu{color:var(--mu);font-size:12px}small{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}
input,select{width:100%;padding:10px;border:1px solid #dcdce0;border-radius:10px;background:#fff;color:var(--tx);font:inherit;margin-top:4px}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--pr)}
button{font:inherit;cursor:pointer;border:1px solid #dcdce0;background:#fff;color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
.row{margin-bottom:12px}.row>div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
.bar{position:relative;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0}
.wk{display:flex;gap:4px;margin-bottom:12px}
.dy{flex:1;padding:6px 0;border-radius:12px;font-size:11px;color:var(--mu);position:relative;background:#fff}
.dy b{display:block;font-size:15px;color:var(--tx)}.dy.on{background:var(--pr);border-color:var(--pr);color:#fff}.dy.on b{color:#fff}
.dy i{position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:2px;background:var(--ca)}
.dn{display:flex;gap:8px;align-items:center;margin-bottom:10px}.dn input{margin:0}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mrow>span{font-size:22px;color:var(--mu)}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.it .nm{flex:1;min-width:140px}.it input:checked+.nm b{text-decoration:line-through;color:var(--mu)}
.st{display:flex;align-items:center;gap:6px}.st button{width:30px;height:30px;padding:0;border-radius:15px;font-size:18px;line-height:1}.st span{min-width:26px;text-align:center;font-weight:600}
.x{border:0;background:none;color:var(--mu);font-size:22px;padding:0 4px}
.sg{background:var(--soft);border-radius:12px;padding:10px;margin-top:12px}
.sg .t{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.opt{padding:10px 0;border-top:1px solid #e6e7ea}.opt .a{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border-radius:16px;padding:6px 11px;font-size:13px}
.bk{border:0;background:none;color:var(--pr);padding:0;margin-bottom:6px;font-weight:600}
a.btn{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:var(--pr);color:#fff;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:12px;padding:6px}nav button.on{color:var(--pr);font-weight:700}
nav button b{display:block;font-size:18px}
</style></head>
<body><main id="app"></main>
<nav id="nav"><button data-a="pg" data-p="home"><b>🍽</b>Today</button><button data-a="pg" data-p="health"><b>❤️</b>Health</button><button data-a="pg" data-p="report"><b>📊</b>Report</button><button data-a="pg" data-p="targets"><b>🎯</b>Targets</button></nav>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const MN={b:'Breakfast',l:'Lunch',s:'Snacks',d:'Dinner',f:'Fruits'},SPL={b:.25,l:.3,s:.15,d:.3};
const SD=[['Dahi / raita (1 bowl)',6,8,90,'v',1],['Dal (1 bowl)',9,20,130,'v',1],['Cucumber-onion salad',1,6,30,'v',1],['Extra roti',3,15,85,'v',1],['Paneer cubes (50 g)',9,2,130,'v',1]];
const DB={
b:[['Poha with peanuts (1 plate)',6,45,250,'v'],['Moong dal chilla ×2',14,24,200,'v'],['Besan chilla ×2',12,26,220,'v'],['Idli ×3 + sambar',9,40,260,'v'],['Paneer paratha ×1',10,32,330,'v'],['Upma (1 bowl)',6,38,240,'v'],['Oats with milk and nuts',12,42,320,'v'],['Egg bhurji (2 eggs) + 1 roti',16,18,280,'e'],['Masala omelette (3 eggs) + toast',20,18,330,'e'],['Dahi (1 bowl)',6,8,90,'v',1],['Sprouts salad (1 bowl)',10,18,120,'v',1],['Boiled eggs ×2',12,1,140,'e',1],['Whey shake',24,4,120,'v',1]],
l:[['Dal + 2 roti + sabzi',16,52,430,'v'],['Rajma + 1 cup rice',14,62,450,'v'],['Chole + 2 roti',16,60,460,'v'],['Paneer bhurji + 2 roti',22,36,460,'v'],['Soya chunk curry + 2 roti',28,40,420,'v'],['Veg pulao',8,50,330,'v'],['Moong dal khichdi',13,46,330,'v'],['Egg curry (2 eggs) + 1 cup rice',18,50,470,'e'],['Chicken curry + 1 cup rice',32,46,480,'n'],['Fish curry + 1 cup rice',28,45,440,'n'],...SD],
s:[['Roasted chana (30 g)',6,17,120,'v'],['Sprouts chaat',10,20,150,'v'],['Peanuts (30 g)',8,5,170,'v'],['Makhana (30 g)',3,22,105,'v'],['Sattu drink',9,20,120,'v'],['Whey shake',24,4,120,'v'],['Paneer tikka (80 g)',14,4,210,'v'],['Boiled eggs ×2',12,1,140,'e'],['Moong dal cheela ×1',7,12,110,'v'],['Chaas (1 glass)',3,5,40,'v',1],['Dahi (1 bowl)',6,8,90,'v',1]],
d:[['Dal + 2 roti',15,50,380,'v'],['Paneer tikka + 2 roti',28,34,450,'v'],['Soya chunk curry + 1 roti',24,28,330,'v'],['Palak paneer + 1 roti',20,28,360,'v'],['Moong dal khichdi + curd',16,50,420,'v'],['Tofu bhurji + 1 roti',20,22,290,'v'],['Egg bhurji + 2 roti',18,34,360,'e'],['Grilled chicken + sabzi + 1 roti',35,22,380,'n'],['Tandoori fish + salad + 1 roti',30,20,330,'n'],...SD]};
const FR=[['Banana',1,27,105],['Apple',0.5,25,95],['Orange',1,15,60],['Papaya (1 bowl)',1,15,60],['Guava',3,14,60],['Mango (1 cup)',1,25,100],['Pomegranate (½ cup)',1,17,80],['Watermelon (1 bowl)',1,11,45],['Grapes (1 cup)',1,27,100]];
const CM=[['Roti / chapati','roti',3,15,85],['Dal (cooked)','bowl',9,20,130],['Rice (cooked)','cup',4,45,205],['Curd','bowl',6,8,90],['Sabzi','katori',2,10,80],['Boiled egg','egg',6,0.5,70],['Paneer','50 g',9,2,130],['Idli','idli',3,13,70],['Plain paratha','paratha',5,28,200],['Dosa','dosa',4,25,160],['Milk','glass',8,12,150],['Chaas','glass',3,5,40],['Dal tadka','bowl',8,18,140],['Rajma','bowl',9,24,150],['Chole','bowl',10,27,180],['Paneer bhurji','bowl',14,6,230],['Poha','plate',6,45,250],['Upma','bowl',6,38,240],['Moong chilla','chilla',7,12,100],['Besan chilla','chilla',6,13,110],['Khichdi','bowl',8,32,200],['Soya chunks (cooked)','katori',13,6,100],['Chicken curry','katori',18,5,200],['Whey protein','scoop',24,4,120],['Peanuts','30 g',8,5,170],['Banana','piece',1,27,105],['Samosa','piece',4,24,260],['Poori','piece',3,15,125],['Oats (cooked)','bowl',6,27,160],['Sprouts','bowl',10,18,120],['Besan chilla with paneer filling','chilla',11.5,14,190]];
const td=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Math.round(n*10)/10,ki=n=>Math.round(n);
const tt=(a,k,e)=>a.reduce((x,i)=>x+(e&&!i.done?0:i[k]*i.q),0);
function load(){let d;try{d=JSON.parse(localStorage.getItem('nt2'))}catch(e){}
 return Object.assign({tp:100,tc:250,tk:2000,diet:'v',pref:''},d||{},{date:td()})}
let S=load(),P='home',M='b',AI={},AIS={},OFF={},OQ={},CUR=[],CF={n:'',u:'',q:1,p:'',c:'',k:'',mode:'n'},sample=null;
S.days=S.days||{};
const save=()=>{try{localStorage.setItem('nt2',JSON.stringify(S))}catch(e){}push()};
let ACC={s:'local',name:''},cloud=null,pt=0,FL='';
const push=()=>{if(ACC.s!=='cloud'||!cloud)return;clearTimeout(pt);pt=setTimeout(async()=>{try{await cloud.ref.set({json:JSON.stringify(S)});ACC.sync='ok'}catch(e){ACC.sync='failed'}if(P==='targets')render()},800)};
const accCard=()=>`<section class="card"><h2>Account</h2>${ACC.s==='cloud'?`<b>${esc(ACC.name||'Signed in')}</b><small>Signed in with your claude.ai account. Your meals, targets, weight and BP sync privately to this account on every device${ACC.sync==='failed'?' (last sync failed; it will retry on your next change)':''}.</small>`:`<b>Not signed in</b><small>${ACC.err?'Couldn’t reach your account.':'Open this page while signed in to claude.ai to get your own private account.'} Your data is saved on this device only.</small>`}</section>`;
const D=()=>S.days[S.date]||(S.days[S.date]={m:{b:[],l:[],s:[],d:[],f:[]}});
const has=k=>{const d=S.days[k];return d&&(d.w||d.sys||Object.values(d.m).some(a=>a.length))};
const ok=t=>S.diet==='n'||t==='v'||(S.diet==='e'&&t==='e');
const tgt=m=>({p:S.tp*SPL[m],c:S.tc*SPL[m]});
const fd=d=>(d===td()?'Today, ':'')+new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const bar=(d,p,t,c)=>`<div class="bar"><i style="width:${Math.min(100,p/(t||1)*100)}%;background:${c};opacity:.3"></i><i style="width:${Math.min(100,d/(t||1)*100)}%;background:${c}"></i></div>`;
const row=(l,u,d,p,t,c)=>`<div class="row"><div><b>${l}</b><span>${ki(d)} / ${t} ${u}</span></div>${bar(d,p,t,c)}<small>${ki(p)} ${u} planned · ${Math.max(0,ki(t-d))} left</small></div>`;
const st=(a,i)=>`<div class="st"><button data-a="${a}m" data-i="${i}">−</button><span>${i&&OQ[i]!==undefined?OQ[i]:''}</span><button data-a="${a}p" data-i="${i}">+</button></div>`;
const stp=(a,i,q)=>`<div class="st"><button data-a="${a}m" data-i="${i}" aria-label="Less">−</button><span>${q}</span><button data-a="${a}p" data-i="${i}" aria-label="More">+</button></div>`;

const KEYS=[/dal/,/roti/,/dahi|curd|raita/,/paneer/,/salad/,/egg/,/whey/,/chaas/,/sprouts/];
const dup=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();return KEYS.some(k=>k.test(a)&&k.test(b))};
function combos(m){
 const pool=DB[m].filter(x=>ok(x[4])),mains=pool.filter(x=>!x[5]),sides=pool.filter(x=>x[5]);
 const t=tgt(m),pl=D().m[m],rp=Math.max(0,t.p-tt(pl,'p')),rc=Math.max(0,t.c-tt(pl,'c'));
 if(rp<3&&rc<8)return{rp,rc,list:[]};
 const o=[];mains.forEach(a=>{o.push([a]);sides.forEach(s=>{if(!dup(a[0],s[0]))o.push([a,s])})});
 const sc=x=>Math.abs(x.reduce((s,i)=>s+i[1],0)-rp)/Math.max(rp,5)+Math.abs(x.reduce((s,i)=>s+i[2],0)-rc)/Math.max(rc,10);
 o.sort((a,b)=>sc(a)-sc(b));const k=(OFF[m]||0)%4;
 return{rp,rc,list:o.slice(k*3,k*3+3).map(x=>({items:x.map(i=>({n:i[0],u:'serving',p:i[1],c:i[2],k:i[3]}))}))};
}
function strip(){
 const d=new Date(S.date+'T00:00'),s=new Date(d);s.setDate(d.getDate()-(d.getDay()+6)%7);
 let h=`<div class="dn"><button data-a="wk" data-d="-7" aria-label="Previous week">‹</button><input type="date" id="dt" value="${S.date}"><button data-a="wk" data-d="7" aria-label="Next week">›</button></div><div class="wk">`;
 for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);const k=x.toLocaleDateString('en-CA');
  h+=`<button class="dy${k===S.date?' on':''}" data-a="day" data-d="${k}">${'MTWTFSS'[i]}<b>${x.getDate()}</b>${has(k)?'<i></i>':''}</button>`}
 return h+'</div>';
}
function home(){
 const d=D(),all=Object.values(d.m).flat();
 let h=`<h1>${fd(S.date)}</h1>${ACC.name?`<small style="margin:-4px 0 8px">Hi, ${esc(ACC.name)}</small>`:''}`+strip()+(FL?`<div class="sg" style="margin:0 0 12px"><b>✓ ${esc(FL)}</b></div>`:'')+`<section class="card"><h2>Daily progress</h2>`+
  row('Protein','g',tt(all,'p',1),tt(all,'p'),S.tp,'var(--pr)')+row('Carbs','g',tt(all,'c',1),tt(all,'c'),S.tc,'var(--ca)')+row('Calories','kcal',tt(all,'k',1),tt(all,'k'),S.tk,'var(--ka)')+
  `<small>Solid = ticked as eaten · faded = planned</small></section>${waterCard()}${stepCard()}<h2 class="sec">Meals</h2>`;
 ['b','l','s','d','f'].forEach(m=>{const a=d.m[m];
  h+=`<button class="mrow" data-a="open" data-m="${m}"><div><b>${MN[m]}</b><small>${a.length?`${a.length} item${a.length>1?'s':''} · P ${f(tt(a,'p',1))} g · C ${f(tt(a,'c',1))} g · ${ki(tt(a,'k',1))} kcal eaten`:'Tap to plan this meal'}</small></div><span>›</span></button>`});
 h+=`<button class="mrow" data-a="pg" data-p="health"><div><b>Weight &amp; BP</b><small>${d.w||d.sys?`${d.w?d.w+' kg':''}${d.w&&d.sys?' · ':''}${d.sys?'BP '+d.sys+'/'+d.dia:''}`:'Not logged for this day'}</small></div><span>›</span></button>`;
 return h;
}
function meal(){
 const m=M,pl=D().m[m];
 let h=`<button class="bk" data-a="pg" data-p="home">‹ Back</button><h1>${MN[m]}</h1><small style="margin:-4px 0 10px">${fd(S.date)}</small><section class="card">`;
 if(m!=='f'){const t=tgt(m);
  h+=`<div class="row"><div><b>Protein</b><span>${f(tt(pl,'p',1))} / ${f(t.p)} g</span></div>${bar(tt(pl,'p',1),tt(pl,'p'),t.p,'var(--pr)')}</div><div class="row"><div><b>Carbs</b><span>${f(tt(pl,'c',1))} / ${f(t.c)} g</span></div>${bar(tt(pl,'c',1),tt(pl,'c'),t.c,'var(--ca)')}</div>`}
 h+=`<small>${ki(tt(pl,'k',1))} kcal eaten · ${ki(tt(pl,'k'))} kcal planned</small>`;
 if(!pl.length)h+=`<p class="mu">Nothing added yet.</p>`;
 pl.forEach(i=>{h+=`<div class="it"><input type="checkbox" data-a="tog" data-i="${i.id}" ${i.done?'checked':''} aria-label="Eaten"><div class="nm"><b>${esc(i.n)}</b><small>${i.u==='g'?i.q+' g':i.q+' × '+esc(i.u)}</small><small>Protein ${f(i.p*i.q)} g (${i.u==='g'?i.q+' g × '+r2(i.p*100)+' g per 100 g':i.q+' × '+r2(i.p)+' g'}) · Carbs ${f(i.c*i.q)} g (${i.u==='g'?i.q+' g × '+r2(i.c*100)+' g per 100 g':i.q+' × '+r2(i.c)+' g'}) · ${ki(i.k*i.q)} kcal</small></div>${stp('q',i.id,i.q)}<button class="x" data-a="del" data-i="${i.id}" aria-label="Remove">×</button></div>`});
 h+='</section>';
 h+=`<button class="p" style="width:100%;margin:-4px 0 12px" data-a="savem">✓ Save ${MN[m]} &amp; view day</button>`;
 if(m==='f')h+=`<section class="card"><h2>Add a fruit</h2><div class="chips">${FR.map((x,i)=>`<button class="chip" data-a="addf" data-i="${i}">+ ${x[0]}</button>`).join('')}</div></section>`;
 else{
  const c=combos(m),opts=[...(AI[m]||[]),...c.list];CUR=opts;
  h+=`<section class="card"><div class="sg" style="margin:0"><div class="t"><b>Suggestions</b><span><button data-a="more">↻ More</button> `+(sample?`<button class="p" data-a="ai" ${AIS[m]==='...'?'disabled':''}>${AIS[m]==='...'?'Thinking…':'✨ Ask Claude'}</button>`:'')+`</span></div>`+
   (c.list.length||AI[m]?`<small>Aiming for about P ${ki(c.rp)} g · C ${ki(c.rc)} g more. Adjust the quantity, then add.</small>`:`<small>You’re on target for this meal. Nice.</small>`);
  opts.forEach((o,i)=>{o.key=o.items.map(x=>x.n).join('+');const q=OQ[o.key]||1,sm=k=>o.items.reduce((s,x)=>s+x[k]*q,0);
   h+=`<div class="opt"><b>${o.ai?'✨ ':''}${esc(o.items.map(x=>x.n).join(' + '))}</b><small>P ${f(sm('p'))} g · C ${f(sm('c'))} g · ${ki(sm('k'))} kcal</small><div class="a">${stp('o',i,q)}<button class="p" data-a="add" data-i="${i}">+ Add</button></div></div>`});
  if(AIS[m]&&AIS[m]!=='...')h+=`<small>${esc(AIS[m])}</small>`;
  h+='</div></section>';
 }
 h+=`<section class="card"><h2>Add your own food</h2><label class="f">Quick pick<select id="qk"><option value="">Choose a common food…</option>${CM.map((x,i)=>`<option value="${i}">${x[0]} (per ${x[1]})</option>`).join('')}</select></label>
 <label class="f">Food name<input id="cn" list="fl" value="${esc(CF.n)}" placeholder="Type or pick, e.g. Dal tadka"></label><div class="g2" style="margin-bottom:10px"><button data-a="mode" data-v="n" class="${CF.mode==='g'?'':'p'}">Count (roti, cup…)</button><button data-a="mode" data-v="g" class="${CF.mode==='g'?'p':''}">Weight (grams)</button></div><datalist id="fl">${CM.map(x=>`<option value="${x[0]}">`).join('')}</datalist>
 <div class="g2"><label class="f">${CF.mode==='g'?'Weight eaten (g)':'Quantity'}<input id="cq" type="number" min="0.5" step="${CF.mode==='g'?'1':'0.5'}" inputmode="decimal" value="${CF.q}"></label><label class="f" style="${CF.mode==='g'?'display:none':''}">Unit<input id="cu" list="ul" value="${esc(CF.u)}" placeholder="roti, cup, bowl…"></label></div>
 <datalist id="ul"><option>roti</option><option>cup</option><option>bowl</option><option>katori</option><option>plate</option><option>piece</option><option>glass</option><option>g</option><option>tbsp</option></datalist>
 <small style="margin-bottom:6px">${CF.mode==='g'?'Values are per 100 g. Enter the weight you ate above.':'Values are per 1 unit, so edit them if yours differs.'}</small>
 <div class="g3"><label class="f">Protein (g) per ${CF.mode==='g'?'100 g':'unit'}<input id="cp" type="number" min="0" inputmode="decimal" value="${CF.p}"></label><label class="f">Carbs (g) per ${CF.mode==='g'?'100 g':'unit'}<input id="cc" type="number" min="0" inputmode="decimal" value="${CF.c}"></label><label class="f">kcal per ${CF.mode==='g'?'100 g':'unit'}<input id="ck" type="number" min="0" inputmode="decimal" value="${CF.k}" placeholder="auto"></label></div>
 <div class="sg" style="margin:0 0 10px"><b id="pv" style="font-weight:600">${pv()}</b></div>${sample?`<button style="width:100%;margin-bottom:8px" data-a="est" ${EST==='...'?'disabled':''}>${EST==='...'?'Estimating…':'✨ Estimate with Claude'}</button>`:''}${EST&&EST!=='...'?`<small style="margin-bottom:8px">${esc(EST)}</small>`:''}<button class="p" style="width:100%" data-a="cust">Add to ${MN[m]}</button></section>`;
 return h;
}
function health(){
 const d=D();
 let h=`<h1>Weight &amp; BP</h1>`+strip()+`<section class="card"><h2>${fd(S.date)}</h2><label class="f">Weight (kg)<input id="hw" type="number" step="0.1" inputmode="decimal" value="${d.w||''}"></label>
 <div class="g2"><label class="f">BP systolic (mmHg)<input id="hs" type="number" inputmode="numeric" value="${d.sys||''}"></label><label class="f">BP diastolic (mmHg)<input id="hd" type="number" inputmode="numeric" value="${d.dia||''}"></label></div>
 <button class="p" style="width:100%" data-a="hsave">Save for this day</button></section><h2 class="sec">Recent entries</h2><section class="card">`;
 const ks=Object.keys(S.days).filter(k=>S.days[k].w||S.days[k].sys).sort().reverse().slice(0,10);
